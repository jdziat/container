# Fixture for `container compose doctor` — intentional loud edges (do not up in corpus).
services:
  app:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases: [shared]
  worker:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    volumes:
      - data:/data
    networks:
      default:
        aliases: [shared]
  nfsclient:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    volumes:
      - type: nfs
        source: /export
        target: /mnt
        addr: 127.0.0.1

volumes:
  data:
