name: corpus-nfs
services:
  client:
    image: docker.io/library/alpine:3.20
    command: ["sh", "-c", "ls -la /nfs && cat /nfs/hello.txt && sleep 5"]
    networks:
      - nfsnet
    volumes:
      - nfsshare:/nfs:ro
volumes:
  nfsshare:
    driver: nfs
    driver_opts:
      type: nfs
      o: "addr=${COMPOSE_NFS_SERVER},ro,nfsvers=3,nolock"
      device: "${COMPOSE_NFS_EXPORT}"
networks:
  nfsnet:
    external: true
    name: nfsnet
