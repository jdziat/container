# Immich-shaped production stack (official layout). ML is optional (profile: ml)
# so the default corpus smoke stays pullable. Requires Compose ${VAR} /.env interpolation.
# Postgres uses a named volume + PGDATA subdir: guest chown on virtiofs roots can fail.
name: parity-immich
services:
  immich-server:
    container_name: parity_immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Official Immich mounts upload at /usr/src/app/upload (not /data).
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
    env_file:
      - .env
    environment:
      IMMICH_HOST: ${IMMICH_HOST:-0.0.0.0}
    ports:
      - "2283:2283"
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: parity_immich_ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    profiles: ["ml"]
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: parity_immich_redis
    image: docker.io/valkey/valkey:8-bookworm
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: parity_immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      # Immich vector image reads these (same as official compose).
      DB_STORAGE_TYPE: HDD
      # Named volumes often include lost+found; initdb needs an empty subdir.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 60
      # CR VMM bring-up is slower than VZ; give initdb + vector extensions headroom.
      start_period: 90s

volumes:
  model-cache:
  pgdata:
